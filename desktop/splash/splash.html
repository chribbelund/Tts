<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self'; style-src 'self'; script-src 'self'">
  <title>Chat Reader</title>
  <link rel="stylesheet" href="splash.css">
</head>
<body>
  <main>
    <img class="icon" src="../build/icon.png" alt="" width="88" height="88">
    <h1>Chat Reader</h1>
    <p class="status" id="status" role="status">Starting…</p>
    <div class="bar" id="bar" role="progressbar" aria-labelledby="status" data-busy="true">
      <div class="fill" id="fill"></div>
    </div>
    <p class="detail" id="detail"></p>
    <button type="button" id="skip">Open without updating</button>
  </main>
  <script src="splash.js"></script>
</body>
</html>
