appId: com.github.chribbelund.chatreader
productName: Chat Reader
copyright: Copyright © Christoffer Lundqvist

directories:
  buildResources: build
  output: dist

# Only the shell, the bot (bot/, overlay/), the screen reader (screen/) and the copied page. electron-builder adds the production
# dependencies (the TikTok connector) from node_modules on its own.
# build/icon.png is also read at runtime, for the tray and window icons.
files:
  - main.js
  - update-main.js
  - splash-main.js
  - splash/**/*
  - preload.js
  - accelerator.js
  - bot-main.js
  - db-main.js
  - multistream-main.js
  - import-main.js
  - screen-main.js
  - screen/**/*
  - bot/**/*
  - overlay/**/*
  - sources/**/*
  - package.json
  - build/icon.png
  - web/**/*

asar: true
npmRebuild: false
artifactName: chat-reader-${version}-${os}-${arch}.${ext}

# Where the app looks for updates (update-main.js). The release workflow uploads
# latest.yml, latest-mac.yml and the .blockmap files next to the downloads.
publish:
  provider: github
  owner: chribbelund
  repo: Tts

mac:
  icon: build/icon.png
  category: public.app-category.entertainment
  darkModeSupport: true
  # Unsigned builds: see the README for the first-run steps on each OS.
  identity: null
  target:
    - target: dmg
      arch: [universal]
    - target: zip
      arch: [universal]

dmg:
  title: Chat Reader ${version}

win:
  icon: build/icon.png
  target:
    - target: nsis
      arch: [x64, arm64]
    - target: portable
      arch: [x64]

# One click, like Discord: no wizard. It installs for the current user (no
# admin prompt) into %LOCALAPPDATA%\Programs and opens the app straight away.
# Updates run the same installer silently from inside the app (update-main.js).
nsis:
  oneClick: true
  perMachine: false
  runAfterFinish: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Chat Reader
  deleteAppDataOnUninstall: false

portable:
  artifactName: chat-reader-${version}-windows-portable.${ext}
