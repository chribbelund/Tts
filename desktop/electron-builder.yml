appId: com.github.chribbelund.chatreader
productName: Chat Reader
copyright: Copyright © Christoffer Lundqvist

directories:
  buildResources: build
  output: dist

# Only the shell and the copied page; node_modules holds build tools alone.
# build/icon.png is also read at runtime, for the tray and window icons.
files:
  - main.js
  - preload.js
  - accelerator.js
  - package.json
  - build/icon.png
  - web/**/*

asar: true
npmRebuild: false
artifactName: chat-reader-${version}-${os}-${arch}.${ext}

mac:
  icon: build/icon.png
  category: public.app-category.entertainment
  darkModeSupport: true
  # Unsigned builds: see the README for the first-run steps on each OS.
  identity: null
  target:
    - target: dmg
      arch: [universal]
    - target: zip
      arch: [universal]

dmg:
  title: Chat Reader ${version}

win:
  icon: build/icon.png
  target:
    - target: nsis
      arch: [x64, arm64]
    - target: portable
      arch: [x64]

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  shortcutName: Chat Reader

portable:
  artifactName: chat-reader-${version}-windows-portable.${ext}
