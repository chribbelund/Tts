name: Desktop app

on:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - 'desktop/**'
      - 'js/**'
      - 'index.html'
      - 'style.css'
      - '.github/workflows/desktop.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (universal)
            os: macos-latest
            args: --mac
          - name: Windows (x64, arm64)
            os: windows-latest
            args: --win
          - name: Linux (x64, arm64)
            os: ubuntu-latest
            args: --linux
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install dependencies
        working-directory: desktop
        run: npm ci

      - name: Check the page and the shell parse
        working-directory: desktop
        run: node --check main.js && node --check preload.js && node --check accelerator.js && node --check ../js/app.js

      - name: Copy the page into the app
        working-directory: desktop
        run: npm run sync-web

      - name: Build
        working-directory: desktop
        run: npx electron-builder ${{ matrix.args }} --publish never
        env:
          # The builds are unsigned; the README says what to do on first run.
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}
          if-no-files-found: error
          path: |
            desktop/dist/*.dmg
            desktop/dist/*.zip
            desktop/dist/*.exe
            desktop/dist/*.AppImage
            desktop/dist/*.deb

  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - run: ls -lh artifacts

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          draft: false
          generate_release_notes: true
          body: |
            Desktop builds of Chat Reader, with hotkeys that keep working while a game is focused.

            | Platform | Download |
            |---|---|
            | macOS (Intel and Apple silicon) | `.dmg`, or `.zip` |
            | Windows | `*-setup.exe` (installer) or `*-portable.exe` |
            | Linux | `.AppImage` (run it as is) or `.deb` |

            The builds are not code-signed, so the first launch needs one extra step:

            - **macOS:** right-click the app → *Open* → *Open*.
            - **Windows:** *More info* → *Run anyway* on the SmartScreen notice.
            - **Linux:** `chmod +x` the AppImage.
