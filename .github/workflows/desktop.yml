name: Desktop app

on:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - 'desktop/**'
      - 'js/**'
      - 'index.html'
      - 'style.css'
      - '.github/workflows/desktop.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (universal)
            os: macos-latest
            args: --mac
          - name: Windows (x64, arm64)
            os: windows-latest
            args: --win
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install dependencies
        working-directory: desktop
        run: npm ci

      - name: Check the page, the shell and the bot parse
        working-directory: desktop
        shell: bash
        run: |
          for f in *.js sources/*.js bot/*.js overlay/*.js screen/*.js ../js/*.js; do
            node --check "$f" || exit 1
          done

      - name: Copy the page into the app
        working-directory: desktop
        run: npm run sync-web

      - name: Build
        working-directory: desktop
        run: npx electron-builder ${{ matrix.args }} --publish never
        env:
          # The builds are unsigned; the README says what to do on first run.
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.os }}
          if-no-files-found: error
          path: |
            desktop/dist/*.dmg
            desktop/dist/*.zip
            desktop/dist/*.exe

  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - run: ls -lh artifacts

      - uses: softprops/action-gh-release@v3
        with:
          files: artifacts/*
          draft: false
          generate_release_notes: true
          body: |
            Desktop builds of Chat Reader: reads Twitch, YouTube and TikTok chat out loud, with hotkeys that keep working while a game is focused.

            | Platform | Download |
            |---|---|
            | macOS (Intel and Apple silicon) | `.dmg`, or `.zip` |
            | Windows | `*-setup.exe` (installer) or `*-portable.exe` |

            The builds are not code-signed, so the first launch needs one extra step:

            - **macOS:** right-click the app → *Open* → *Open*.
            - **Windows:** *More info* → *Run anyway* on the SmartScreen notice.
